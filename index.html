<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Schedule Organizer</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --primary: #1d4ed8;
      --primary-soft: #dfe9ff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --success: #0f766e;
      --warning: #f59e0b;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
      color: var(--text);
    }

    .app {
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3rem);
      color: var(--primary);
    }

    .header p {
      margin: 10px auto 0;
      max-width: 700px;
      color: var(--muted);
      font-size: 1rem;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .input-panel {
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text);
      font-size: 1.05rem;
    }

    textarea {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      font-size: 0.95rem;
      line-height: 1.6;
      background: #fbfdff;
      color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      font-family: "Courier New", monospace;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.12);
    }

    .button-row {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .primary-btn {
      background: var(--primary);
      color: white;
    }

    .secondary-btn {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .upload-section {
      margin-top: 18px;
      padding: 20px;
      background: #f9fafb;
      border: 2px dashed var(--border);
      border-radius: 12px;
      text-align: center;
    }

    .upload-section input[type="file"] {
      display: none;
    }

    .upload-label {
      cursor: pointer;
      background: var(--primary);
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      display: inline-block;
      font-weight: 700;
      transition: background 0.2s ease;
    }

    .upload-label:hover {
      background: #1e40af;
    }

    .schedule-output {
      margin-top: 14px;
    }

    .day-group {
      margin-bottom: 24px;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
    }

    .day-header {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      color: var(--primary);
      font-size: 1.1rem;
      font-weight: 700;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }

    .schedule-table {
      width: 100%;
      border-collapse: collapse;
    }

    .schedule-table th,
    .schedule-table td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .schedule-table th {
      background: #f9fafb;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .schedule-table tr:last-child td {
      border-bottom: none;
    }

    .course-name {
      font-weight: 700;
      color: var(--text);
      font-size: 0.95rem;
    }

    .time-chip {
      display: inline-block;
      background: #ecfdf5;
      color: var(--success);
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.8rem;
    }

    .room-badge {
      display: inline-block;
      background: #fff7ed;
      color: #b45309;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.8rem;
    }

    .teacher-name {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .direction {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.5;
    }

    .empty-state {
      text-align: center;
      padding: 40px 18px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 14px;
      background: #fafafa;
    }

    .footer-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .pdf-btn {
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
      color: white;
      padding: 16px 28px;
      font-size: 1.05rem;
      border-radius: 12px;
      box-shadow: 0 12px 20px rgba(22, 163, 74, 0.25);
    }

    .clear-btn {
      background: #ef4444;
      color: white;
      padding: 16px 28px;
      font-size: 1.05rem;
      border-radius: 12px;
      box-shadow: 0 12px 20px rgba(239, 68, 68, 0.25);
    }

    .success-msg {
      background: #d1fae5;
      color: #065f46;
      padding: 12px 16px;
      border-radius: 8px;
      margin-top: 12px;
      display: none;
    }

    @media (max-width: 700px) {
      .panel {
        padding: 18px;
      }

      .schedule-table thead {
        display: none;
      }

      .schedule-table,
      .schedule-table tbody,
      .schedule-table tr,
      .schedule-table td {
        display: block;
        width: 100%;
      }

      .schedule-table tr {
        border-bottom: 1px solid var(--border);
        padding: 8px 0;
        margin-bottom: 12px;
      }

      .schedule-table td {
        border: none;
        padding: 6px 16px;
      }

      .schedule-table td::before {
        content: attr(data-label);
        display: block;
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 4px;
      }
    }

    @media print {
      body {
        background: white;
      }

      .input-panel,
      .button-row,
      .upload-section,
      .footer-actions,
      .pdf-btn,
      .primary-btn,
      .secondary-btn,
      .clear-btn {
        display: none !important;
      }

      .app {
        max-width: 100%;
        margin: 0;
        padding: 0;
      }

      .panel {
        box-shadow: none;
        border: none;
        padding: 0;
      }

      .day-group {
        page-break-inside: avoid;
        break-inside: avoid;
        margin-bottom: 18px;
      }

      .schedule-table th {
        background: #f3f4f6;
      }

      .direction {
        color: #374151;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>School Schedule Organizer</h1>
      <p>Paste your school timetable below and turn it into a clean weekly schedule view.</p>
    </header>

    <section class="panel input-panel">
      <label for="scheduleInput">Paste your school timetable here</label>
      <textarea id="scheduleInput" placeholder="Paste the timetable from your school portal. It should have:
- Period names (HR, L1, L2, etc.) on the left
- Days (Monday, Tuesday, etc.) across the top
- For each class: [time], subject, teacher, room code"></textarea>

      <div class="button-row">
        <button class="primary-btn" id="parseBtn">Parse Schedule</button>
        <button class="secondary-btn" id="sampleBtn" type="button">Load Sample</button>
      </div>

      <div class="upload-section">
        <p style="margin: 0 0 12px 0; color: var(--muted);">Or upload a text file (.txt):</p>
        <label class="upload-label" for="fileInput">Choose File</label>
        <input type="file" id="fileInput" accept=".txt" />
        <div class="success-msg" id="successMsg">File loaded successfully!</div>
      </div>
    </section>

    <section class="panel">
      <div id="scheduleOutput" class="schedule-output"></div>
    </section>

    <div class="footer-actions">
      <button class="pdf-btn" id="downloadBtn" type="button">Download Schedule as PDF</button>
      <button class="clear-btn" id="clearBtn" type="button">Clear All</button>
    </div>
  </div>

  <script>
    // Room direction rules for your school
    const roomDirectionRules = [
      {
        name: "F Wing",
        test: (roomText) => /SS\s*F/i.test(roomText),
        direction: "(F Wing Classrooms)"
      },
      {
        name: "G Wing",
        test: (roomText) => /SS\s*G/i.test(roomText),
        direction: "(G Wing Classrooms)"
      }
    ];

    function getDirectionForRoom(roomText) {
      const room = roomText || "";
      for (const rule of roomDirectionRules) {
        if (rule.test(room)) {
          return rule.direction;
        }
      }
      return "";
    }

    // Parse the exact timetable format from your school
    function parseSchoolTimetable(rawText) {
      const text = rawText.trim();
      if (!text) return [];

      // Split into lines
      const lines = text.split(/\n/).map(line => line.trim()).filter(line => line && !line.match(/^(Secondary Week|Timetable Week|P\s*Monday|Monday\s+Tuesday)/i));

      // Find the header row with day names
      let headerRowIndex = -1;
      let dayNames = [];
      
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (/Monday|Tuesday|Wednesday|Thursday|Friday/.test(line)) {
          headerRowIndex = i;
          // Extract day names from the line
          const days = line.split(/\s+/).filter(d => /Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday/.test(d));
          dayNames = days.slice(0, 5); // Take first 5 days
          break;
        }
      }

      if (headerRowIndex === -1 || dayNames.length === 0) {
        return [];
      }

      // Now parse the schedule blocks
      const entries = [];
      let currentPeriod = null;
      let periodLines = [];

      for (let i = headerRowIndex + 1; i < lines.length; i++) {
        const line = lines[i];

        // Check if this is a period label (HR, L1, L2, etc.)
        if (/^(HR|L[1-8]|SN|LN|P)$/.test(line.trim())) {
          if (currentPeriod && periodLines.length > 0) {
            const parsed = parsePeriodBlock(currentPeriod, periodLines, dayNames);
            entries.push(...parsed);
          }
          currentPeriod = line.trim();
          periodLines = [];
          continue;
        }

        if (currentPeriod) {
          periodLines.push(line);
        }
      }

      // Don't forget the last period
      if (currentPeriod && periodLines.length > 0) {
        const parsed = parsePeriodBlock(currentPeriod, periodLines, dayNames);
        entries.push(...parsed);
      }

      return entries;
    }

    function parsePeriodBlock(periodName, blockLines, dayNames) {
      const results = [];
      const text = blockLines.join(" ");

      // Extract all time blocks [HH:MM - HH:MM]
      const timeMatches = text.match(/\[\d{2}:\d{2}\s*-\s*\d{2}:\d{2}\]/g) || [];

      // Extract subject names, teachers, room codes
      // These are lines that don't start with [ and aren't empty
      const classInfo = blockLines.filter(line => !line.match(/^\[/) && line.trim());

      if (timeMatches.length === 0) return results;

      // Parse each day's info
      let dayIndex = 0;
      let classIndex = 0;

      for (let i = 0; i < timeMatches.length && dayIndex < dayNames.length; i++) {
        const time = timeMatches[i].replace(/[\[\]]/g, "").trim();
        const day = dayNames[dayIndex];

        // Collect class info for this period/day
        let subject = "";
        let teacher = "";
        let room = "";

        // Look ahead to collect subject, teacher, room
        if (classIndex < classInfo.length) {
          subject = classInfo[classIndex] || "";
          classIndex++;
        }
        if (classIndex < classInfo.length && /^(Mr|Ms|Miss|Mrs)/.test(classInfo[classIndex])) {
          teacher = classInfo[classIndex] || "";
          classIndex++;
        }
        if (classIndex < classInfo.length && /SS\s*[FG]\d+/.test(classInfo[classIndex])) {
          room = classInfo[classIndex] || "";
          classIndex++;
        }

        // Only add if we have a subject
        if (subject && subject.trim()) {
          results.push({
            day: day,
            time: time,
            room: room || "Room TBA",
            name: subject.trim(),
            teacher: teacher.trim(),
            direction: getDirectionForRoom(room)
          });
        }

        dayIndex++;
      }

      return results;
    }

    // Fallback parser for simpler formats
    function parseSimpleSchedule(rawText) {
      const text = rawText.trim();
      if (!text) return [];

      const lines = text.split("\n");
      const entries = [];
      let currentDay = "Weekly Schedule";

      lines.forEach((line) => {
        const cleanLine = line.trim();
        if (!cleanLine) return;

        const dayMatch = cleanLine.match(/\b(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\b/i);
        const timeMatch = cleanLine.match(/(\d{1,2}:\d{2}\s*(?:AM|PM)\s*-\s*\d{1,2}:\d{2}\s*(?:AM|PM))/i);

        if (dayMatch) {
          currentDay = dayMatch[1];
          if (!timeMatch) return;
        }

        if (!timeMatch) return;

        const roomMatch = cleanLine.match(/(?:Room|Rm|Lab|Gym|SS\s*[FG]\d+)\s*[A-Za-z0-9\/ ]*/i);
        const roomText = roomMatch ? roomMatch[0] : "Room TBA";

        let className = cleanLine
          .replace(dayMatch ? dayMatch[0] : "", "")
          .replace(timeMatch[0], "")
          .replace(roomText, "")
          .replace(/\s{2,}/g, " ")
          .trim();

        if (!className) return;

        entries.push({
          day: currentDay,
          time: timeMatch[0],
          room: roomText,
          name: className,
          teacher: "",
          direction: getDirectionForRoom(roomText)
        });
      });

      return entries;
    }

    function parseSchedule(rawText) {
      const text = rawText.trim();
      if (!text) {
        scheduleOutput.innerHTML = '<div class="empty-state">No schedule entered yet. Paste your timetable to begin.</div>';
        return [];
      }

      // Try school timetable format first
      let entries = parseSchoolTimetable(text);

      // Fall back to simple format if school timetable parsing returns nothing
      if (!entries || entries.length === 0) {
        entries = parseSimpleSchedule(text);
      }

      if (!entries || entries.length === 0) {
        scheduleOutput.innerHTML = '<div class="empty-state">No classes could be detected. Make sure your timetable includes day names (Monday-Friday) and times.</div>';
        return [];
      }

      renderSchedule(entries);
      return entries;
    }

    function renderSchedule(entries) {
      if (!entries || entries.length === 0) {
        scheduleOutput.innerHTML = '<div class="empty-state">No classes to display.</div>';
        return;
      }

      const grouped = {};
      entries.forEach((entry) => {
        if (!grouped[entry.day]) grouped[entry.day] = [];
        grouped[entry.day].push(entry);
      });

      const orderedDays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday", "Weekly Schedule"];
      const sortedDayKeys = orderedDays.filter(day => grouped[day]).concat(
        Object.keys(grouped).filter(day => !orderedDays.includes(day))
      );

      scheduleOutput.innerHTML = sortedDayKeys.map((day) => {
        const items = grouped[day];
        const rows = items.map((item) => `
          <tr>
            <td data-label="Time"><span class="time-chip">${escapeHtml(item.time)}</span></td>
            <td data-label="Course"><span class="course-name">${escapeHtml(item.name)}</span></td>
            <td data-label="Teacher"><div class="teacher-name">${escapeHtml(item.teacher)}</div></td>
            <td data-label="Room"><span class="room-badge">${escapeHtml(item.room)}</span></td>
          </tr>
        `).join("");

        return `
          <div class="day-group">
            <div class="day-header">${day}</div>
            <table class="schedule-table">
              <thead>
                <tr>
                  <th>Time</th>
                  <th>Course</th>
                  <th>Teacher</th>
                  <th>Room</th>
                </tr>
              </thead>
              <tbody>
                ${rows}
              </tbody>
            </table>
          </div>
        `;
      }).join("");
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    const scheduleInput = document.getElementById("scheduleInput");
    const scheduleOutput = document.getElementById("scheduleOutput");
    const parseBtn = document.getElementById("parseBtn");
    const sampleBtn = document.getElementById("sampleBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const clearBtn = document.getElementById("clearBtn");
    const fileInput = document.getElementById("fileInput");
    const successMsg = document.getElementById("successMsg");

    parseBtn.addEventListener("click", () => {
      parseSchedule(scheduleInput.value);
    });

    sampleBtn.addEventListener("click", () => {
      const sampleText = `Monday	Tuesday	Wednesday	Thursday	Friday
HR	
[07:30 - 07:40]
Homeroom
Mr Elmaandi
SS G09
[07:30 - 07:40]
Homeroom
Mr Elmaandi
SS G09
[07:30 - 07:40]
Homeroom
Mr Elmaandi
SS G09
[07:30 - 07:40]
Homeroom
Mr Elmaandi
SS G09
[07:30 - 07:40]
Homeroom
Mr Elmaandi
SS G09
L1	
[07:40 - 08:35]
ISL B
Mr Alameldin
SS G05
[07:40 - 08:35]
ARB B
Ms Ahmed
SS G07
[07:40 - 08:35]
MATHS
Ms Munawar
SS G99
[07:40 - 08:35]
MATHS
Ms Munawar
SS G99
[07:40 - 08:30]
ARB B
Ms Ahmed
SS G07
L2	
[08:35 - 09:30]
ENG A
Ms Iqbal
SS F83
[08:35 - 09:30]
ENG A
Ms Iqbal
SS F83
[08:35 - 09:30]
VART
Mr Street
SS G82/ G83
[08:35 - 09:30]
ARB B
Ms Ahmed
SS G07
[08:30 - 09:20]
PD
Ms Katikar
SS F19/ F22`;
      scheduleInput.value = sampleText;
      parseSchedule(sampleText);
    });

    downloadBtn.addEventListener("click", () => {
      window.print();
    });

    clearBtn.addEventListener("click", () => {
      scheduleInput.value = "";
      scheduleOutput.innerHTML = '<div class="empty-state">No schedule entered yet. Paste your timetable to begin.</div>';
      fileInput.value = "";
    });

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const text = event.target.result;
        scheduleInput.value = text;
        parseSchedule(text);

        successMsg.style.display = "block";
        setTimeout(() => {
          successMsg.style.display = "none";
        }, 3000);
      };
      reader.readAsText(file);
    });

    // Initialize with empty state
    scheduleOutput.innerHTML = '<div class="empty-state">Paste your school timetable to get started!</div>';
  </script>
</body>
</html>
